# MIN2 設定ファイルのサンプル。すべて省略可能(省略した項目は既定値)。
# 使い方:
#   CLI      : python -m min2.MIN2ver2 image.png --config min2_config.yaml
#              (--config 省略時は 環境変数 MIN2_CONFIG → ./min2_config.yaml → MIN2ver2.py の隣 の順に探す)
#   Python   : MIN2_ignore_sunspots(img_inst, config="min2_config.yaml")
# 優先順位: 関数/CLIの明示引数 > このYAML > コード内の既定値

n: 10                    # 画像格子の分割数(2以上)
light_threshold: 50      # 太陽像とみなす輝度のしきい値(16bit画像は自動で256倍)
limb_wigth: 24           # 整数はpix単位。文字列なら "1/20" のように太陽半径に対する割合を指定。
iter_cycles: 2           # 黒点排除の最大反復回数(0なら排除なし)
show: false              # 結果を描画する(CLIの既定は true)
debug: false             # ログ・途中経過を出力する(CLIの既定は true)
show_simple: false       # 描画をシンプル表示にする
plot_point_size: null     # nullなら詳細50 / 簡易400 / レビュー85を維持。数値指定で全表示に共通適用(pt²)
plot_point_color: null    # nullなら従来色を維持。指定時はMatplotlib色名またはHEX色を使用(レビューの除外点は橙色)
interactive_review: true # Tkinterウィンドウ1つで処理中表示・各反復プレビュー・最終結果を更新
                          # 点をクリックして除外・復帰。画面のボタンで適用／取消
save_result: false      # trueにすると設定・除外点・反復履歴を含む <画像名>_min2.json を保存
dir_mode_limb_wigth: 60  # CLIの --dir(フォルダ一括)時に使う limb_wigth
